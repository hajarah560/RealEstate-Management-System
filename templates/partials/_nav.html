<header class="topnav">
  <a class="brand" href="{% url 'dashboard' %}"><i class="bi bi-house-door-fill"></i>Estate Desk</a>
  <nav class="links" aria-label="Main">
    <a href="{% url 'dashboard' %}"{% if request.path == "/" %} class="current" aria-current="page"{% endif %}>Overview</a>
    <a href="{% url 'client_list' %}"{% if "/clients/" in request.path %} class="current" aria-current="page"{% endif %}>Clients</a>
    <a href="{% url 'employee_list' %}"{% if "/employees/" in request.path %} class="current" aria-current="page"{% endif %}>Employees</a>
    <a href="{% url 'land_list' %}"{% if "/land/" in request.path %} class="current" aria-current="page"{% endif %}>Land</a>
    <a href="{% url 'building_list' %}"{% if "/buildings/" in request.path %} class="current" aria-current="page"{% endif %}>Buildings</a>
    <a href="{% url 'lease_list' %}"{% if "/leases/" in request.path %} class="current" aria-current="page"{% endif %}>Leases</a>
    <a href="{% url 'payment_list' %}"{% if "/payments/" in request.path %} class="current" aria-current="page"{% endif %}>Payments</a>
  </nav>
  <div class="who">
    <span><i class="bi bi-person-circle"></i> {{ user.get_username }}</span>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-small" type="submit">Log out</button></form>
  </div>
</header>
