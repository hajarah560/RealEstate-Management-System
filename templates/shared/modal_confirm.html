<div class="modal-title danger">
  <h2 id="modal-title">{{ modal_title }}</h2>
  <button type="button" class="modal-close" data-close aria-label="Close"><i class="bi bi-x-lg"></i></button>
</div>
<form method="post" action="{{ request.path }}">
  {% csrf_token %}
  <div class="modal-body">
    <p>Are you sure you want to delete <strong>{{ object }}</strong>? This cannot be undone.{% if delete_note %} It also deletes {{ delete_note }}.{% endif %}</p>
  </div>
  <div class="modal-foot">
    <button type="button" class="btn" data-close>Cancel</button>
    <button type="submit" class="btn btn-danger">Delete</button>
  </div>
</form>
