<div class="modal-head">
  <h2 id="modal-title">{{ modal_title }}?</h2>
  <button type="button" class="icon-btn" data-close aria-label="Close"><i class="ph ph-x" aria-hidden="true"></i></button>
</div>
<form method="post" action="{{ request.path }}">
  {% csrf_token %}
  <div class="modal-body">
    <p class="modal-text"><strong>{{ object }}</strong> will be deleted{% if delete_note %}, along with {{ delete_note }}{% endif %}.</p>
    <p class="modal-text modal-warning">This cannot be undone.</p>
  </div>
  <div class="modal-foot">
    <button type="button" class="btn btn-ghost" data-close>Cancel</button>
    <button type="submit" class="btn btn-danger"><i class="ph ph-trash" aria-hidden="true"></i>Delete</button>
  </div>
</form>
