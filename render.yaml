
services:
  - type: web
    name: realestate
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn realestate.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.7"
      - key: DATABASE_URL
        fromDatabase:
          name: realestate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: realestate-db
    databaseName: realestate
    user: realestate
    plan: free
