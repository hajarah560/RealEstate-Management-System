{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Log In{% endblock %}

{% block content %}
    <div class="container mt-4">
        <h1>Log In</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            <button type="submit" class="btn btn-primary">Log In</button>
        </form>
    </div>
{% endblock %}
