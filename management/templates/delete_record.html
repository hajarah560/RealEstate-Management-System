{% extends 'base.html' %}

{% block title %}Delete {{ record_type }}{% endblock %}

{% block content %}
    <div class="container mt-4">
        <h1>Delete {{ record_type }}</h1>
        <p>Are you sure you want to delete {{ record }}? Related records may also be deleted.</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{% url back_url %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
